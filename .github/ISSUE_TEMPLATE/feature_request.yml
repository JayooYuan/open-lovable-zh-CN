name: 功能建议
description: 提议可维护的新功能或社区版改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户场景，不要只给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议适合非官方简体中文社区版。
          required: true
        - label: 我已说明它是否会增加新的外部服务、费用或安全风险。
          required: true
