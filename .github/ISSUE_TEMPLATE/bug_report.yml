name: Bug 报告
description: 报告可复现的功能、兼容性或汉化问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、私人端点、带鉴权参数的 URL、用户数据或完整环境文件。

  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v3-zh.1 或完整 commit SHA
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 中文界面或布局
        - Firecrawl 抓取
        - E2B 沙箱
        - Vercel Sandbox
        - 模型 provider
        - 生成、预览或下载
        - 安装、构建或 CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏示例说明最小复现步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏日志
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Node 22 / pnpm 11 / E2B

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除密钥、私人 URL 和用户数据。
          required: true
        - label: 我确认复现步骤是否会调用付费外部服务，并已在说明中标注。
          required: true
